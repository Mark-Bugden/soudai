[project]
name = "soudai"
version = "0.1.0"
description = "Data pipeline and analysis for the Judging the Journey demo: how civil cases move through Czech district courts."
readme = "README.md"
license = "MIT"
authors = [{ name = "Mark Bugden" }]
requires-python = ">=3.12"
dependencies = [
    "lifelines>=0.30",   # caps pandas below 3.0
    "numpy>=2.5",
    "pandas>=2.3",
    "pyarrow>=26.0",
    "requests>=2.34",
    "scipy>=1.18",
]

[project.scripts]
soudai = "soudai.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
