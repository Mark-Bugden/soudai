name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python (pipeline and analysis, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv publishes no floating major tags after v7
      - run: uv sync --locked
      - run: uv run pytest
